# =============================================================================
# BetterDesk - stable release on merge to main
# =============================================================================
# When a PR is merged into main, bump version, publish tag + GitHub Release from
# the bump commit, and open a PR to land VERSION files on protected main.
# Direct push to main is not used (branch protection: require pull request).
#
# Repo setting required for the bump PR step:
#   Settings -> Actions -> General -> Workflow permissions
#   -> "Allow GitHub Actions to create and approve pull requests"
# Tag/release still succeed if that checkbox is off.
#
# release-server / docker-publish attach artifacts to the tag/release.
# =============================================================================

name: Version Bump & Release (main)

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Publishing verification reads GHCR package tags.
  packages: read
  # Required to dispatch release-server / docker-publish: tag and Release
  # creation use GITHUB_TOKEN, and GITHUB_TOKEN-produced events never trigger
  # other workflows. Explicit dispatch is the documented exception, so without
  # this scope a stable release ships with zero artifacts and no image (#488).
  actions: write

concurrency:
  group: stable-release-main
  cancel-in-progress: false

jobs:
  release-stable:
    # Skip the auto version-bump PR itself to avoid recursive bumps.
    if: |
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'release/v') &&
      !contains(github.event.pull_request.title, '[version-bump]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bump version (minor release or hotfix patch)
        id: bump
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Stable feature releases: +0.1.0. Hotfix PRs (label "hotfix" or title
          # containing "hotfix", e.g. 3.4.0 -> 3.4.1): +0.0.1.
          BUMP_ARGS=(--minor)
          LABELS_LC=$(echo "$PR_LABELS" | tr '[:upper:]' '[:lower:]')
          TITLE_LC=$(echo "$PR_TITLE" | tr '[:upper:]' '[:lower:]')
          if echo "$LABELS_LC" | grep -qw 'hotfix' || echo "$TITLE_LC" | grep -q 'hotfix'; then
            BUMP_ARGS=(--patch)
            echo "Hotfix detected - using patch bump (+0.0.1)"
          else
            echo "Stable release - using minor bump (+0.1.0)"
          fi
          node scripts/bump-version.js "${BUMP_ARGS[@]}"
          NEW_VERSION=$(cat VERSION | tr -d '\n')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump on release branch
        id: commit
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(node scripts/bump-version.js --list-paths)
          if git diff --cached --quiet; then
            echo "No version files changed - tagging current main tip only"
            echo "has_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$BUMP_BRANCH"
          git commit -m "chore: release version ${NEW_VERSION} [version-bump]"
          git push -u origin "HEAD:${BUMP_BRANCH}" --force
          echo "has_bump=true" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          HAS_BUMP: ${{ steps.commit.outputs.has_bump }}
        run: |
          set -euo pipefail
          TAG="v${NEW_VERSION}"
          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT
          awk -v ver="${NEW_VERSION}" '
            BEGIN { found=0 }
            /^## \[/ {
              if ($0 ~ "\\[" ver "\\]") { found=1; print; next }
              if (found && /^## \[/ && $0 !~ "\\[" ver "\\]") { exit }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "BetterDesk ${NEW_VERSION} stable release." > "$NOTES_FILE"
          fi

          # Tag the bump commit when present; otherwise clean main tip
          # (discard uncommitted local bump so tag SHA matches published VERSION).
          if [ "${HAS_BUMP}" = "true" ]; then
            git checkout "release/v${NEW_VERSION}"
          else
            git fetch origin main
            git reset --hard origin/main
            NEW_VERSION=$(tr -d '\n' < VERSION)
            TAG="v${NEW_VERSION}"
            echo "No bump commit - using VERSION on main (${NEW_VERSION})"
          fi

          # Record the resolved version/tag for the dispatch step below
          # ("no bump commit" can override TAG from the VERSION file).
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          else
            echo "Tag ${TAG} already exists - checking release state"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists"
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release create "$TAG" \
            --title "BetterDesk ${NEW_VERSION}" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
          echo "release_created=true" >> "$GITHUB_OUTPUT"

      # A tag/Release created with GITHUB_TOKEN does not trigger `push:
      # tags` or `release: published`, so both publishers are dispatched
      # explicitly here. Without this the Release has no binaries and GHCR
      # never gets the version tag or `latest` (#488).
      - name: Publish Release artifacts and container images
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Dispatching server artifact release for ${TAG}"
          gh workflow run "Build & Release Go Server" --ref "$TAG"
          echo "Dispatching container image publish for ${TAG}"
          gh workflow run "Build & Publish Docker Images" --ref "$TAG" -f tag=latest
          echo "Dispatched both publishers for ${TAG}"
          echo "${TAG}" > "${RUNNER_TEMP}/released_tag"

      # Guards against silent regression of #488: a stable release must end up
      # with downloadable binaries on the Release. Image publication is
      # reported, not enforced - docker-publish can legitimately take 1-3h and
      # exceeding the job timeout would fail a release that is actually fine.
      - name: Verify Release assets published
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail

          assets_ok=false
          for attempt in $(seq 1 60); do
            count=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "Release ${TAG} has ${count} asset(s)"
              assets_ok=true
              break
            fi
            echo "Waiting for Release assets on ${TAG} (attempt ${attempt}/60)..."
            sleep 20
          done

          images_ok=false
          for attempt in $(seq 1 45); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1 \
               && curl -fsS -o /dev/null \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
                    "https://ghcr.io/v2/unitronix/betterdesk-server/manifests/${NEW_VERSION}" 2>/dev/null; then
              echo "GHCR betterdesk-server:${NEW_VERSION} published"
              images_ok=true
              break
            fi
            echo "Waiting for GHCR tag ${NEW_VERSION} (attempt ${attempt}/45)..."
            sleep 20
          done

          if [ "$images_ok" != true ]; then
            echo "::warning::GHCR tag ${NEW_VERSION} was not visible within 15 minutes. Images may still be building - check the 'Build & Publish Docker Images' run before assuming a failure."
          else
            echo "Container images present for ${NEW_VERSION}."
          fi

          if [ "$assets_ok" != true ]; then
            echo "::error::Stable release ${TAG} has no downloadable assets. Inspect the dispatched 'Build & Release Go Server' run, then upload the binaries manually."
            exit 1
          fi
          echo "Stable release ${TAG} verified."

      - name: Open version-bump PR into main
        if: steps.commit.outputs.has_bump == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          if gh pr view "$BUMP_BRANCH" --json number >/dev/null 2>&1; then
            echo "PR for ${BUMP_BRANCH} already exists"
            gh pr view "$BUMP_BRANCH" --json url -q .url
            exit 0
          fi
          BODY=$(printf '%s\n' \
            "Automated stable version bump to ${NEW_VERSION} after merge to main." \
            "" \
            "Tag v${NEW_VERSION} and the GitHub Release are created from this bump commit." \
            "Merge this PR so VERSION on main matches the published tag." \
            "" \
            "Do not remove the [version-bump] marker from the title (prevents recursive bumps)." \
            "Server/Docker asset workflows attach to the tag, not to this PR merge.")
          if ! gh pr create \
            --base main \
            --head "$BUMP_BRANCH" \
            --title "chore: release version ${NEW_VERSION} [version-bump]" \
            --body "$BODY"; then
            echo "::warning::Could not open version-bump PR (enable Settings > Actions > Workflow permissions > Allow GitHub Actions to create and approve pull requests). Branch ${BUMP_BRANCH} is pushed; open the PR manually."
            exit 1
          fi
