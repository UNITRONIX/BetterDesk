# =============================================================================
# BetterDesk — automatic patch version bump on dev branch
# =============================================================================
# Every push to dev (except version-bump commits) bumps product version +0.0.1
# across Tier 1/2 files via scripts/bump-version.js.
#
# Branch protection on `dev` requires a pull request, so the bump lands via a
# short-lived PR (squash merge) — same pattern as version-bump-main.yml.
# Direct GITHUB_TOKEN pushes to `dev` are rejected by protection rules.
#
# After a successful bump merge, explicitly dispatch docker-publish (tag=dev).
# GITHUB_TOKEN events do not re-trigger other workflows (#401).
# =============================================================================

name: Version Bump (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: version-bump-dev
  cancel-in-progress: false

jobs:
  bump-patch:
    # Skip only real auto-bump commits (subject line), not feature messages that
    # happen to mention the marker in the body. Squash-merged bump PRs keep the
    # chore: bump subject so this filter prevents recursive bumps.
    if: |
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.head_commit.message, 'chore: release version')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Bump patch version
        id: bump
        run: |
          node scripts/bump-version.js --patch
          NEW_VERSION=$(cat VERSION | tr -d '\n')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=chore/bump-dev-v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit bump on temporary branch
        id: commit
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(node scripts/bump-version.js --list-paths)
          if git diff --cached --quiet; then
            echo "No version files changed — skipping"
            echo "has_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$BUMP_BRANCH"
          git commit -m "chore: bump version to ${NEW_VERSION} [version-bump]"
          git push -u origin "HEAD:${BUMP_BRANCH}" --force
          echo "has_bump=true" >> "$GITHUB_OUTPUT"

      - name: Open and squash-merge bump PR into dev
        id: merge
        if: steps.commit.outputs.has_bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          BUMP_BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          if ! gh pr view "$BUMP_BRANCH" --json number >/dev/null 2>&1; then
            BODY=$(printf '%s\n' \
              "Automated patch version bump to ${NEW_VERSION} after a push to \`dev\`." \
              "" \
              "Squash-merge keeps the \`chore: bump version … [version-bump]\` subject so the" \
              "next push does not recurse. Do not remove the \`[version-bump]\` marker.")
            if ! gh pr create \
              --base dev \
              --head "$BUMP_BRANCH" \
              --title "chore: bump version to ${NEW_VERSION} [version-bump]" \
              --body "$BODY"; then
              echo "::error::Could not open version-bump PR. Enable Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests. Branch ${BUMP_BRANCH} is pushed."
              exit 1
            fi
          else
            echo "PR for ${BUMP_BRANCH} already exists"
          fi

          PR_URL=$(gh pr view "$BUMP_BRANCH" --json url -q .url)
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          # Pushes/PRs created with GITHUB_TOKEN do not start other workflows, so
          # required checks never appear on this PR. Merge with admin bypass
          # (dev has enforce_admins=false). Squash keeps the chore: bump subject.
          if ! gh pr merge "$BUMP_BRANCH" --squash --admin --delete-branch; then
            echo "::error::Could not merge ${PR_URL}. Ensure Actions can create PRs and that a repo admin token can bypass protection, or merge manually."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GHCR :dev image publish
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Explicit dispatch — bump commits from GITHUB_TOKEN do not start workflows.
          gh workflow run .github/workflows/docker-publish.yml --ref dev -f tag=dev
          echo "Dispatched docker-publish for :dev (VERSION ${{ steps.bump.outputs.version }})"
