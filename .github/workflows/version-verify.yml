name: Version Verify

on:
  push:
    branches: [main, dev]
    paths:
      - 'VERSION'
      - 'betterdesk-server/VERSION'
      - 'betterdesk-server/internal/productversion/VERSION'
      - 'web-nodejs/package.json'
      - 'betterdesk.sh'
      - 'betterdesk.ps1'
      - 'betterdesk-docker.sh'
      - 'install.sh'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'Dockerfile*'
      - 'docker-compose.quick.yml'
      - 'docker-compose.quick.single.yml'
      - 'docker-compose.quick.single.macvlan.yml'
      - 'docker/**'
      - 'docker-entrypoint.sh'
      - 'scripts/bump-version.js'
      - '.github/workflows/version-verify.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'VERSION'
      - 'betterdesk-server/VERSION'
      - 'betterdesk-server/internal/productversion/VERSION'
      - 'web-nodejs/package.json'
      - 'betterdesk.sh'
      - 'betterdesk.ps1'
      - 'betterdesk-docker.sh'
      - 'install.sh'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'Dockerfile*'
      - 'docker-compose.quick.yml'
      - 'docker-compose.quick.single.yml'
      - 'docker-compose.quick.single.macvlan.yml'
      - 'docker/**'
      - 'docker-entrypoint.sh'
      - 'scripts/bump-version.js'
      - '.github/workflows/version-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify product version parity
        run: node scripts/bump-version.js --verify
