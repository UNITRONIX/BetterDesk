# BetterDesk Go server — vet + tests on push/PR
name: Go Server CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'betterdesk-server/**'
      - '.github/workflows/go-server-ci.yml'
  pull_request:
    paths:
      - 'betterdesk-server/**'
      - '.github/workflows/go-server-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: betterdesk-server

jobs:
  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: betterdesk-server/go.mod
          cache-dependency-path: betterdesk-server/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  mesh-interop:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: betterdesk-server/go.mod
          cache-dependency-path: betterdesk-server/go.sum

      - name: Mesh interop (simulated handshake)
        working-directory: betterdesk-server
        run: go test ./meshcentral/... -count=1 -timeout 5m

      - name: Mesh interop (live MeshAgent binary)
        working-directory: betterdesk-server
        continue-on-error: true
        run: go test -tags=meshagent_live ./meshcentral/... -run TestMeshAgentLiveConnect -count=1 -timeout 10m
