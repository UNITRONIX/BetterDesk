name: Web Console CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'web-nodejs/**'
      - '.github/workflows/web-nodejs-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'web-nodejs/**'
      - '.github/workflows/web-nodejs-ci.yml'

permissions:
  contents: read

concurrency:
  group: web-nodejs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[version-bump]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-nodejs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web-nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check browser JavaScript syntax
        run: npm run check:frontend

      - name: Verify protocol schema artifacts
        run: npm run protocols:check

      - name: Run tests
        run: npm run test:ci

      # Blocking gate: hard failures (missing/extra keys, empty values) must stop
      # the build. Pre-existing English fallbacks are soft findings and do not
      # fail the step, so the historical backlog does not block this job.
      - name: Verify i18n parity across console locales
        run: npm run i18n:check
