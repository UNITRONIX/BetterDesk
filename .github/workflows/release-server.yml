# =============================================================================
# BetterDesk Go Server — Cross-Compile & Release
# =============================================================================
# Builds Go server binary for Linux (amd64, arm64) and Windows (amd64).
# Triggers on main/dev pushes, version tag pushes (v*) or manual dispatch.
# Every run publishes commit-bound artifacts; tag runs also attach binaries +
# SHA256 checksums to a GitHub Release.
# =============================================================================

name: Build & Release Go Server

on:
  push:
    branches: [main, dev]
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  SERVER_DIR: betterdesk-server

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.SERVER_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVER_DIR }}/go.sum

      - name: Install Protobuf Compiler
        run: sudo apt-get install -y protobuf-compiler

      - name: Build binary
        working-directory: ${{ env.SERVER_DIR }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="$(tr -d '\r\n' < ../VERSION)"
          BINARY_NAME="betterdesk-server-${{ matrix.suffix }}"
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "${BINARY_NAME}" .
          SHA256="$(sha256sum "${BINARY_NAME}" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "${BINARY_NAME}")"
          cat > "${BINARY_NAME}.manifest.json" <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "version": "${VERSION}",
            "goos": "${{ matrix.goos }}",
            "goarch": "${{ matrix.goarch }}",
            "asset": "${BINARY_NAME}",
            "size": ${SIZE},
            "sha256": "${SHA256}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: betterdesk-server-${{ matrix.suffix }}
          path: |
            ${{ env.SERVER_DIR }}/betterdesk-server-${{ matrix.suffix }}
            ${{ env.SERVER_DIR }}/betterdesk-server-${{ matrix.suffix }}.manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Migration tool
  # ---------------------------------------------------------------------------
  build-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.SERVER_DIR }}/go.mod
          cache-dependency-path: ${{ env.SERVER_DIR }}/go.sum

      - name: Build migration tool (linux-amd64)
        working-directory: ${{ env.SERVER_DIR }}/tools/migrate
        env:
          CGO_ENABLED: 1
        run: go build -trimpath -ldflags="-s -w" -o migrate-linux-amd64 .

      - name: Upload migration tool
        uses: actions/upload-artifact@v4
        with:
          name: migrate-linux-amd64
          path: ${{ env.SERVER_DIR }}/tools/migrate/migrate-linux-amd64

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          find . -type f \( -name "betterdesk-server-*" -o -name "migrate-*" \) | while read -r f; do
            sha256sum "$f" >> SERVER_CHECKSUMS.sha256
          done
          cat SERVER_CHECKSUMS.sha256

      - name: Upload server artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "GitHub Release $TAG_NAME was not created within 20 minutes" >&2
              exit 1
            fi
            sleep 10
          done

          gh release upload "$TAG_NAME" \
            betterdesk-server-linux-amd64/betterdesk-server-linux-amd64 \
            betterdesk-server-linux-amd64/betterdesk-server-linux-amd64.manifest.json \
            betterdesk-server-linux-arm64/betterdesk-server-linux-arm64 \
            betterdesk-server-linux-arm64/betterdesk-server-linux-arm64.manifest.json \
            betterdesk-server-windows-amd64.exe/betterdesk-server-windows-amd64.exe \
            betterdesk-server-windows-amd64.exe/betterdesk-server-windows-amd64.exe.manifest.json \
            migrate-linux-amd64/migrate-linux-amd64 \
            SERVER_CHECKSUMS.sha256 \
            --clobber
