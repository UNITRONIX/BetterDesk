# RETIRED — desktop clients are built and released in UNITRONIX/BetterDesk-Client.
# This monorepo imports signed GitHub Releases (generic agent / generator templates)
# and must not build betterdesk-desktop here (tree is archived as *_old).
#
# Historical workflow name kept so GitHub Actions UI shows the retirement clearly.

name: Build & Release Desktop Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Desktop builds moved to BetterDesk-Client
        run: |
          echo "Desktop client CI lives in https://github.com/UNITRONIX/BetterDesk-Client"
          echo "BetterDesk console imports signed releases; it does not build clients in this repo."
