version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web-nodejs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      web-nodejs-npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      root-npm:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/betterdesk-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      betterdesk-server-gomod:
        patterns:
          - "*"
